<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NAMO EXIM - Blog Generator</title>
  <link rel="icon" type="image/x-icon" href="https://namoexim.com/favicon.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="https://namoexim.com/favicon.ico" />
  <link rel="icon" type="image/png" href="https://namoexim.com/images/favicon-48x48.png" sizes="48x48" />
  <link rel="icon" type="image/png" href="https://namoexim.com/images/favicon-192x192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="https://namoexim.com/images/favicon-192x192.png" />
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; font-family: 'Inter', sans-serif; background: #f8fafc; }
    .generator-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #1e293b; }
    input, textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: 'Inter', sans-serif; }
    button { background: #059669; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #047857; }
    #output-container { display: none; margin-top: 30px; }
    pre { background: #1e293b; color: #f8fafc; padding: 20px; border-radius: 6px; overflow-x: auto; font-family: monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="generator-container">
    <h2>NAMO EXIM Blog Generator</h2>
    <p>Fill out the details below to generate the exact HTML code (with SEO & Schema) for your new blog post.</p>
    
    <div class="form-group">
      <label>URL Slug (e.g. benefits-of-soybean-meal)</label>
      <input type="text" id="slug" placeholder="benefits-of-soybean-meal" required>
    </div>
    <div class="form-group">
      <label>Blog Title (Meta Title & H1)</label>
      <input type="text" id="title" placeholder="Why Soybean Meal is the Best Protein Source" required>
    </div>
    <div class="form-group">
      <label>Meta Description (150-160 characters)</label>
      <textarea id="description" rows="3" placeholder="Discover the benefits of Soybean Meal..." required></textarea>
    </div>
    <div class="form-group">
      <label>Keywords (Comma separated)</label>
      <input type="text" id="keywords" placeholder="soybean meal, animal feed, protein source" required>
    </div>
    <div class="form-group">
      <label>Category</label>
      <input type="text" id="category" placeholder="Animal Nutrition" required>
    </div>
    <div class="form-group">
      <label>Read Time</label>
      <input type="text" id="readTime" placeholder="4 Min Read" required>
    </div>
    <div class="form-group">
      <label>Main Image Filename (must be in /images/ folder)</label>
      <input type="text" id="image" placeholder="hero-livestock.jpg" required>
    </div>

    <button onclick="generateHTML()">Generate HTML File</button>

    <div id="output-container">
      <h3>Generated HTML</h3>
      <p>Save this code as <strong><span id="filename-display"></span>.html</strong> inside your <code>blog/</code> folder.</p>
      <button onclick="downloadHTML()" style="background:#2563eb; margin-bottom:10px;">Download File</button>
      <button onclick="copyToClipboard()" style="background:#475569; margin-bottom:10px; margin-left:10px;">Copy to Clipboard</button>
      <pre id="output-code"></pre>
    </div>
  </div>

  <script>
    let generatedHTML = "";
    
    function generateHTML() {
      const slug = document.getElementById('slug').value.trim();
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const keywords = document.getElementById('keywords').value.trim();
      const category = document.getElementById('category').value.trim();
      const readTime = document.getElementById('readTime').value.trim();
      const image = document.getElementById('image').value.trim();
      
      if(!slug || !title || !description) return alert("Please fill the required fields!");

      generatedHTML = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="../images/favicon-48x48.png" sizes="48x48" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css"></noscript>
  
  <link rel="stylesheet" href="../style.css">  <title>${title} | NAMO EXIM</title>
  <meta name="description" content="${description}" />
  <meta name="keywords" content="${keywords}" />
  <link rel="canonical" href="https://namoexim.com/blog/${slug}.html" />
<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4F1QEYR0KG"><\/script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-4F1QEYR0KG');
<\/script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "${title}",
  "description": "${description}",
  "author": {
    "@type": "Organization",
    "name": "NAMO EXIM"
  },
  "publisher": {
    "@type": "Organization",
    "name": "NAMO EXIM",
    "logo": {
      "@type": "ImageObject",
      "url": "https://namoexim.com/images/Logo_Namo_Exim.png"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "https://namoexim.com/blog/${slug}.html"
  }
}
<\/script>
</head>
<body>
  <!-- ========================================
       HEADER / NAVBAR
       ======================================== -->
  <header class="header scrolled" style="position: static; box-shadow: none;">
    <div class="header-inner">
      <div class="header-content">
        <!-- Logo -->
        <a href="../index.html#home" class="logo-link">
          <img src="../images/Logo_Namo_Exim.png" width="500" height="500" alt="NAMO EXIM Logo" class="logo-img">
          <div class="logo-text">
            <span class="logo-name">NAMO EXIM</span>
            <p class="logo-tagline">Exporting Trust Delivering Quality</p>
          </div>
        </a>

        <!-- Desktop Navigation -->
        <nav class="desktop-nav">
          <a href="../index.html#home" class="nav-link">Home</a>
          <a href="../index.html#about" class="nav-link">About</a>
          <a href="../index.html#products" class="nav-link">Products</a>
          <a href="blog.html" class="nav-link active">Blog</a>
          <a href="../index.html#why-choose-us" class="nav-link">Quality</a>
          <a href="../index.html#contact" class="nav-link">Contact</a>
        </nav>

        <!-- Header Right -->
        <div class="header-right">
          <div class="translate-wrapper">
            <div id="google_translate_element"></div>
          </div>
          <a href="https://wa.me/918849118717" target="_blank" rel="noopener noreferrer" class="whatsapp-btn">
            <i class="ri-whatsapp-line" style="font-size:1rem"></i>
            Whatsapp Now
          </a>
        </div>
      </div>
    </div>
  </header>

  <article style="max-width: 800px; margin: 0 auto; padding: 4rem 2rem;">
    <p style="color: var(--emerald-600); font-weight: 600; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px;">${category} &middot; ${readTime}</p>
    <h1 style="font-size: clamp(2rem, 4vw, 3rem); font-family: 'Montserrat', sans-serif; font-weight: 800; color: var(--emerald-950); margin-bottom: 2rem; line-height: 1.2;">${title}</h1>
    <img src="../images/${image}" alt="${title}" style="width: 100%; border-radius: 20px; margin-bottom: 3rem; box-shadow: 0 20px 40px rgba(0,0,0,0.1);">
    
    <div style="font-size: 1.125rem; line-height: 1.8; color: var(--gray-600); font-family: 'Inter', sans-serif;">
      
      <!-- YOUR BLOG CONTENT GOES HERE -->
      <p style="margin-bottom: 1.5rem;">Start writing your first paragraph here...</p>
      
      <h2 style="font-size: 1.75rem; color: var(--emerald-900); font-family: 'Montserrat', sans-serif; margin: 2.5rem 0 1rem;">Heading 2 Example</h2>
      <p style="margin-bottom: 1.5rem;">Continue writing here...</p>
      
      <ul style="margin-bottom: 2rem; padding-left: 1.5rem;">
        <li style="margin-bottom: 1rem;"><strong>Point 1:</strong> Description of point 1.</li>
        <li style="margin-bottom: 1rem;"><strong>Point 2:</strong> Description of point 2.</li>
      </ul>

      <!-- CTA Box -->
      <div style="background: var(--cream); padding: 2rem; border-radius: 16px; border-left: 4px solid var(--gold); margin-top: 3rem;">
        <h4 style="font-family: 'Montserrat', sans-serif; color: var(--emerald-900); margin-bottom: 0.5rem; font-size: 1.25rem;">Source Premium Feed with NAMO EXIM</h4>
        <p style="margin-bottom: 1rem; font-size: 1rem;">At NAMO EXIM, we export hundreds of tonnes of premium quality agricultural feed ingredients. Contact us today for competitive bulk pricing.</p>
        <a href="../index.html#contact" style="color: var(--emerald-700); font-weight: 600; text-decoration: none;">Contact Us <i class="ri-arrow-right-line"></i></a>
      </div>
    </div>
  </article>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-main">
      <div class="footer-grid">
        <div class="footer-logo-section">
          <div class="footer-logo">
            <img loading="lazy" src="../images/Logo_Namo_Exim.png" width="1024" height="1024" alt="NAMO EXIM Logo">
            <div>
              <span class="footer-logo-name">NAMO EXIM</span>
              <p class="footer-logo-tagline">Exporting Trust Delivering Quality</p>
            </div>
          </div>
          <p class="footer-desc">Navkar Traders has been continuously serving the domestic cattle feed industry for over 27 years. Built on trust, quality, and reliability.</p>
        </div>
        
        <div>
          <h4 class="footer-heading">Quick Links</h4>
          <div class="footer-links">
            <a href="../index.html#home" class="footer-link"><i class="ri-arrow-right-s-line"></i> Home</a>
            <a href="../index.html#products" class="footer-link"><i class="ri-arrow-right-s-line"></i> Products</a>
            <a href="blog.html" class="footer-link"><i class="ri-arrow-right-s-line"></i> Blog</a>
          </div>
        </div>

        <div>
          <h4 class="footer-heading">Contact Information</h4>
          <div class="footer-contact-items">
            <div class="footer-contact-item">
              <i class="ri-map-pin-line"></i>
              <p>204, Merushikhar Apartment, Patidarjin Compound, Station Road, Bardoli, Gujarat, India - 394601</p>
            </div>
            <div class="footer-contact-item">
              <i class="ri-mail-line"></i>
              <a href="mailto:info@namoexim.com">info@namoexim.com</a>
            </div>
            <div class="footer-contact-item">
              <i class="ri-phone-line"></i>
              <a href="tel:+918849118717">+91-8849118717</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="footer-bottom">
      <div class="footer-bottom-inner">
        <p>&copy; 2026 NAMO EXIM. All rights reserved.</p>
      </div>
    </div>
  </footer>
</body>
</html>`;
      
      document.getElementById('filename-display').innerText = slug;
      document.getElementById('output-code').innerText = generatedHTML;
      document.getElementById('output-container').style.display = 'block';
    }

    function copyToClipboard() {
      navigator.clipboard.writeText(generatedHTML).then(() => {
        alert('Code copied to clipboard! You can now paste it into a new HTML file.');
      });
    }

    function downloadHTML() {
      const slug = document.getElementById('slug').value.trim() || 'new-blog-post';
      const blob = new Blob([generatedHTML], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = slug + '.html';
      a.click();
    }
  </script>
</body>
</html>
